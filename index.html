<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Candidate School - Staff Database</title>
    <style>
        :root {
            --bg-dark: #0a0d0a;
            --panel-bg: #131a12;
            --panel-border: #2a3d28;
            --accent-gold: #cca43b;
            --accent-green: #23471e;
            --text-light: #e1e8e0;
            --text-muted: #7f917c;
            --table-header: #1a2619;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 24px; }

        .header {
            background: linear-gradient(135deg, #0d170c 0%, #1c301a 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            padding: 20px 28px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-title h1 { color: var(--accent-gold); font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase; }
        .header-title h2 { color: var(--text-light); font-size: 1rem; font-weight: 400; opacity: 0.9; }

        .btn {
            background: var(--accent-green);
            color: #fff;
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #2e5c28; }
        .btn-gold { background: var(--accent-gold); color: #000; border-color: #e5be4a; }
        .btn-gold:hover { background: #e5be4a; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--panel-border); }
        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            border-bottom: none;
            padding: 10px 20px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active { color: var(--accent-gold); background: var(--table-header); border-color: var(--accent-gold); }

        .content-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px; padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--table-header); color: var(--accent-gold); padding: 12px 14px; border: 1px solid var(--panel-border); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 10px 14px; border: 1px solid var(--panel-border); font-size: 0.9rem; }

        input.edit-field { background: #000; border: 1px solid var(--accent-gold); color: #fff; padding: 6px 8px; border-radius: 4px; width: 90%; }

        /* Auth Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal { background: var(--panel-bg); border: 2px solid var(--accent-gold); border-radius: 8px; width: 360px; padding: 24px; text-align: center; }
        .modal input { width: 100%; padding: 10px; margin: 14px 0; background: #000; border: 1px solid var(--panel-border); color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Officer Candidate School</h1>
            <h2>The Filipino Army — Staff Database</h2>
        </div>
        <div>
            <span id="authBadge" style="color: var(--accent-gold); margin-right: 12px; font-size: 0.85rem;">🔒 Read-Only</span>
            <button id="authBtn" class="btn btn-gold" onclick="openAuthModal()">Unlock Editor Mode</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('HQ')">HQ & Command</button>
        <button class="tab-btn" onclick="switchTab('OPS')">OPS</button>
        <button class="tab-btn" onclick="switchTab('OCDF')">OCDF</button>
        <button class="tab-btn" onclick="switchTab('GDH')">GDH</button>
    </div>

    <div class="content-panel">
        <div id="tableContainer">Loading staff records...</div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h3 style="color: var(--accent-gold);">Enter Editor Passcode</h3>
            <input type="password" id="passcodeInput" placeholder="Passcode required...">
            <p id="authError" style="color: #ff5555; display: none; font-size: 0.8rem; margin-bottom: 10px;">Invalid Passcode!</p>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button class="btn btn-gold" onclick="verifyPasscode()">Authenticate</button>
                <button class="btn" onclick="closeAuthModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const PASSCODE = "OCS-Cute-2026";
        const SHEET_API_URL = "Yhttps://script.google.com/macros/s/AKfycbxmTSEvGnMtOLVoqRlDd5UCIJmy2mhCplHgdG7yk8N3St4Val_wGT-QF8h69wzvkRtM/exec"; // PASTE YOUR API URL HERE
        
        let isEditor = false;
        let currentTab = 'HQ';
        
        // Default initial data from PDF fallback
        let fallbackData = {
            HQ: [
                { position: "Commanding General", rank: "LTGEN", username: "Parzival961006", service: "31 DAYS", status: "ACTIVE" },
                { position: "Program Director", rank: "MGEN", username: "odatGamerYt", service: "23 DAYS", status: "ACTIVE" },
                { position: "Program Deputy Director", rank: "BGEN", username: "Kiritosenato123", service: "23 DAYS", status: "ACTIVE" },
                { position: "Assistant Deputy Director", rank: "COL", username: "Rip_banana003", service: "2 DAYS", status: "ACTIVE" }
            ],
            OPS: [
                { position: "Chief (C-OPS)", rank: "COL", username: "noob_rg14", service: "15 DAYS", status: "SEMI-ACTIVE" },
                { position: "Deputy Chief (DC-OPS)", rank: "LTCOL", username: "Yeyemode9192_1", service: "15 DAYS", status: "SEMI-ACTIVE" }
            ],
            OCDF: [
                { position: "Dean of Faculty", rank: "COL", username: "castomer00", service: "15 DAYS", status: "SEMI-ACTIVE" },
                { position: "Deputy Dean", rank: "LTCOL", username: "Persus_Nicholas", service: "15 DAYS", status: "SEMI-ACTIVE" }
            ],
            GDH: [
                { position: "Commandant (C-GDH)", rank: "COL", username: "SHELLOGAMINGFROMYT", service: "15 DAYS", status: "SEMI-ACTIVE" }
            ]
        };

        let currentData = [];

        async function fetchTabData(tab) {
            document.getElementById('tableContainer').innerHTML = 'Fetching updates from Google Sheets...';
            try {
                const response = await fetch(`${SHEET_API_URL}?tab=${tab}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    currentData = data;
                } else {
                    currentData = fallbackData[tab] || [];
                }
            } catch (e) {
                console.warn("Using local database backup.");
                currentData = fallbackData[tab] || [];
            }
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            if (currentData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No personnel records found for this section.</p>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Position</th>
                            <th>Rank</th>
                            <th>Username</th>
                            <th>Service Length</th>
                            <th>Status</th>
                            ${isEditor ? '<th>Actions</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${currentData.map((row, idx) => `
                            <tr>
                                <td>${isEditor ? `<input class="edit-field" id="pos_${idx}" value="${row.position || ''}">` : (row.position || '')}</td>
                                <td>${isEditor ? `<input class="edit-field" id="rnk_${idx}" value="${row.rank || ''}">` : (row.rank || '')}</td>
                                <td>${isEditor ? `<input class="edit-field" id="usr_${idx}" value="${row.username || ''}">` : (row.username || '')}</td>
                                <td>${isEditor ? `<input class="edit-field" id="srv_${idx}" value="${row.service || ''}">` : (row.service || '')}</td>
                                <td>${isEditor ? `<input class="edit-field" id="sts_${idx}" value="${row.status || ''}">` : (row.status || '')}</td>
                                ${isEditor ? `<td><button class="btn btn-gold" onclick="saveRow(${idx})">Save</button></td>` : ''}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            fetchTabData(tab);
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); document.getElementById('authError').style.display = 'none'; }

        function verifyPasscode() {
            const input = document.getElementById('passcodeInput').value;
            if (input === PASSCODE) {
                isEditor = true;
                document.getElementById('authBadge').innerText = '🔓 Editor Mode Authorized';
                document.getElementById('authBtn').style.display = 'none';
                closeAuthModal();
                renderTable();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        async function saveRow(idx) {
            const updatedRow = {
                position: document.getElementById(`pos_${idx}`).value,
                rank: document.getElementById(`rnk_${idx}`).value,
                username: document.getElementById(`usr_${idx}`).value,
                service: document.getElementById(`srv_${idx}`).value,
                status: document.getElementById(`sts_${idx}`).value
            };

            currentData[idx] = updatedRow;
            renderTable();

            await fetch(SHEET_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tab: currentTab, action: 'update', data: updatedRow })
            });

            alert('Record updated and synced with Google Sheets!');
        }

        // Initialize
        fetchTabData('HQ');
    </script>
</body>
</html>
